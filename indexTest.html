    // Function to check if a URL is accessible with timeout
    async function checkLink(url) {
      try {
        // Skip mailto links and onclick handlers
        if (url.startsWith('mailto:') || !url.startsWith('http')) {
          return true;
        }
        
        // Create a promise that rejects after timeout
        const timeoutPromise = new Promise((_, reject) => {
          setTimeout(() => reject(new Error('Timeout')), 1500); // 1.5 second timeout
        });
        
        // Create the fetch promise
        const fetchPromise = fetch(url, { 
          method: 'HEAD',
          mode: 'no-cors',
          cache: 'no-cache'
        });
        
        // Race between fetch and timeout
        await Promise.race([fetchPromise, timeoutPromise]);
        return true; // If we get here, the link is accessible
      } catch (error) {
        return false; // Link is broken or inaccessible
      }
    }

    // Function to check all project links in parallel
    async function checkProjectLinks() {
      const projects = document.querySelectorAll('project');
      
      // Create array of promises for parallel execution
      const linkChecks = Array.from(projects).map(async (project) => {

        const link = project.querySelector('a');

        // Skip already marked projects
        if (project.classList.contains('broken-link')) {
                        link.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
              });
          return; // Skip already marked projects
        }

        if (link) {
          const href = link.getAttribute('href');
          if (href && !link.getAttribute('onclick')) {
            const isWorking = await checkLink(href);
            if (!isWorking) {
              project.classList.add('broken-link');
              // Disable the link
              link.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
              });
            }
          }
        }
      });
      
      // Wait for all checks to complete
      await Promise.all(linkChecks);
    }

    // Run link checking when the page loads
    window.addEventListener('load', function() {
      checkProjectLinks();
    });

  <!-- Add animated geometric pattern script before closing body -->
  <script>
    // Cyberpunk animated geometric pattern
    const canvas = document.getElementById('cyberpunk-bg');
    const ctx = canvas.getContext('2d');
    let w = window.innerWidth;
    let h = window.innerHeight;

    function setCanvasSize() {
      // Use devicePixelRatio for crispness
      const dpr = window.devicePixelRatio || 1;
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
      ctx.scale(dpr, dpr);
    }
    setCanvasSize();
    window.addEventListener('resize', setCanvasSize);
    // On orientation change (for mobile)
    window.addEventListener('orientationchange', setCanvasSize);

    // Helper for animated triangles crossing edges
    function drawEdgeTriangle(edge, progress, color, size = 48) {
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;

      let x, y, angle;
      switch (edge) {
        case 'top':
          x = w * progress;
          y = 0;
          angle = Math.PI / 2;
          break;
        case 'bottom':
          x = w * progress;
          y = h;
          angle = -Math.PI / 2;
          break;
        case 'left':
          x = 0;
          y = h * progress;
          angle = 0;
          break;
        case 'right':
          x = w;
          y = h * progress;
          angle = Math.PI;
          break;
      }
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, -size / 2);
      ctx.lineTo(size / 2, size / 2);
      ctx.lineTo(-size / 2, size / 2);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    // Helper for animated triangles crossing edges as a flock
    function drawEdgeTriangleFlock(edge, baseProgress, color, size = 48, count = 5, spread = 0.06) {
      for (let i = 0; i < count; i++) {
        let progress = (baseProgress + i * spread) % 1;
        ctx.save();
        ctx.globalAlpha = 0.7;
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.shadowColor = color;
        ctx.shadowBlur = 18;

        let x, y, angle;
        switch (edge) {
          case 'top':
            x = w * progress;
            y = 0;
            angle = Math.PI / 2;
            break;
          case 'bottom':
            x = w * progress;
            y = h;
            angle = -Math.PI / 2;
            break;
          case 'left':
            x = 0;
            y = h * progress;
            angle = 0;
            break;
          case 'right':
            x = w;
            y = h * progress;
            angle = Math.PI;
            break;
        }
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(0, -size / 2);
        ctx.lineTo(size / 2, size / 2);
        ctx.lineTo(-size / 2, size / 2);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
    }

    // Track hovered project index and positions
    let hoveredProjectIndex = null;
    let hoveredProjectIconPos = null;
    // Track touch position for mobile
    let touchActive = false;
    let touchPos = null;

    // Helper: get the center position of a project's image/icon (fixed for scroll)
    function getProjectIconCenter(project) {
      const img = project.querySelector('img');
      if (!img) return null;
      const rect = img.getBoundingClientRect();
      // For fixed canvas, use viewport coordinates
      return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };
    }

    // Attach hover listeners to projects
    window.addEventListener('DOMContentLoaded', () => {
      const projects = document.querySelectorAll('projects > project');
      projects.forEach((project, idx) => {
        project.addEventListener('mouseenter', () => {
          hoveredProjectIndex = idx;
          hoveredProjectIconPos = getProjectIconCenter(project);
        });
        project.addEventListener('mousemove', () => {
          hoveredProjectIconPos = getProjectIconCenter(project);
        });
        project.addEventListener('mouseleave', () => {
          hoveredProjectIndex = null;
          hoveredProjectIconPos = null;
        });
      });

      // Touch events for triangles (anywhere on screen)
      document.body.addEventListener('touchstart', function(e) {
        if (e.touches.length > 0) {
          const t = e.touches[0];
          touchActive = true;
          touchPos = { x: t.clientX, y: t.clientY };
        }
      }, { passive: true });
      document.body.addEventListener('touchmove', function(e) {
        if (touchActive && e.touches.length > 0) {
          const t = e.touches[0];
          touchPos = { x: t.clientX, y: t.clientY };
        }
      }, { passive: true });
      document.body.addEventListener('touchend', function(e) {
        touchActive = false;
        touchPos = null;
      }, { passive: true });
    });

    // Triangle "flock" state
    const flockCount = 20;
    let triangles = [];
    function initTriangles() {
      triangles = [];
      for (let i = 0; i < flockCount; i++) {
        // Each triangle starts at a random edge and position
        const edges = ['top', 'bottom', 'left', 'right'];
        const edge = edges[Math.floor(Math.random() * edges.length)];
        const progress = Math.random();
        triangles.push({
          edge,
          progress,
          x: 0.2*Math.random() * w,
          y: 0.5*Math.random() * h,
          angle: Math.random() * Math.PI * 2,
          tx: 0,
          ty: 0,
          tangle: 0,
          color: ['#39ff14', '#00fff7', '#a259ff', '#ffe600'][i % 4],
          jitter: Math.random() * 0.8 + 0.2
        });
      }
    }
    initTriangles();

    // Helper: get edge position for a triangle
    function getEdgePosition(edge, progress, size = 48) {
      let x, y, angle;
      switch (edge) {
        case 'top':
          x = w * progress;
          y = 0;
          angle = Math.PI / 2;
          break;
        case 'bottom':
          x = w * progress;
          y = h;
          angle = -Math.PI / 2;
          break;
        case 'left':
          x = 0;
          y = h * progress;
          angle = 0;
          break;
        case 'right':
          x = w;
          y = h * progress;
          angle = Math.PI;
          break;
      }
      return { x, y, angle };
    }

    // Animate triangles towards target (icon or touch) or back to edge
    function updateTriangles(target) {
      let useTarget = target;
      if (touchActive && touchPos) {
        useTarget = touchPos;
      }
      for (let i = 0; i < triangles.length; i++) {
        let tri = triangles[i];
        let size = 48;
        let edgePos = getEdgePosition(tri.edge, tri.progress, size);

        // If hovering or touch, move towards target with randomness
        if (useTarget) {
          let jitterRadius = 40 + Math.random() * 40;
          let jitterAngle = Math.random() * Math.PI * 2;
          let tx = useTarget.x + Math.cos(jitterAngle) * jitterRadius;
          let ty = useTarget.y + Math.sin(jitterAngle) * jitterRadius;
          tri.x += (tx - tri.x) * (0.04 * tri.jitter);
          tri.y += (ty - tri.y) * (0.04 * tri.jitter);
          tri.angle += (0 - tri.angle) * 0.04;
        } else {
          tri.x += (edgePos.x - tri.x) * (0.04 * tri.jitter);
          tri.y += (edgePos.y - tri.y) * (0.04 * tri.jitter);
          tri.angle += (edgePos.angle - tri.angle) * 0.04;
        }
      }
    }

    // Draw triangles at their positions
    function drawTriangles(ctx, size = 48) {
      for (let i = 0; i < triangles.length; i++) {
        let tri = triangles[i];
        ctx.save();
        ctx.globalAlpha = 0.7;
        ctx.strokeStyle = tri.color;
        ctx.lineWidth = 4;
        ctx.shadowColor = tri.color;
        ctx.shadowBlur = 18;
        ctx.translate(tri.x, tri.y);
        ctx.rotate(tri.angle + Math.sin(performance.now() * 0.001 + i) * 0.1); // add some wiggle
        ctx.beginPath();
        ctx.moveTo(0, -size / 2);
        ctx.lineTo(size / 2, size / 2);
        ctx.lineTo(-size / 2, size / 2);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
    }


    // Screen tearing effect state
    let tearingActive = false;
    let tearingStrength = 0;
    let tearingPhase = 0;
    let tearingBurstTimer = 0;

    function drawCyberpunkPattern(time) {
      ctx.clearRect(0, 0, w, h);
      ctx.globalAlpha = 0.7;

      // Draw animated grid with blue, white, and gray shades (higher contrast)
      let gridSize = 120; // larger grid for fewer lines
      // Screen tearing: burst only at hover start
      let tearOffsets = [];
      if (tearingBurstTimer > 0 || tearingStrength > 0.01) {
        // Animate tearing strength for smooth in/out
        if (tearingBurstTimer > 0) {
          tearingStrength += (1 - tearingStrength) * 0.25;
          tearingBurstTimer--;
        } else {
          tearingStrength += (0 - tearingStrength) * 0.12;
        }
        tearingStrength = Math.max(0, Math.min(1, tearingStrength));
        tearingPhase += 0.18 + Math.random() * 0.08;
        // For each grid row, generate a random offset
        for (let y = 0; y < h; y += gridSize) {
          // Use a combination of noise and sine for a tearing look
          let base = Math.sin(tearingPhase + y * 0.09 + time * 0.008) * 18 * tearingStrength;
          let rand = (Math.random() - 0.5) * 12 * tearingStrength;
          tearOffsets.push(base + rand);
        }
      } else {
        tearingStrength = 0;
      }

      let rowIdx = 0;
      for (let x = 0; x < w; x += gridSize) {
        rowIdx = 0;
        for (let y = 0; y < h; y += gridSize) {
          let t = time * 0.001 + (x + y) * 0.0002;
          let offset = Math.sin(t) * 16;
          // Apply tearing offset if active
          let tearX = (tearOffsets.length > 0) ? tearOffsets[rowIdx] : 0;
          // Vertical lines: ultra-bright neon blue
          ctx.strokeStyle = 'rgba(0,255,255,0.95)';
          ctx.shadowColor = '#00fff7';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(x + offset + tearX, y);
          ctx.lineTo(x + offset + tearX, y + gridSize);
          ctx.stroke();

          // Horizontal lines: bright white
          ctx.strokeStyle = 'rgba(255,255,255,0.45)';
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.moveTo(x, y + offset + tearX);
          ctx.lineTo(x + gridSize, y + offset + tearX);
          ctx.stroke();
          rowIdx++;
        }
      }

      // Draw animated triangles in center with more randomness and wider span
      const centerTriangleCount = 8; // fewer triangles for perf
      for (let i = 0; i < centerTriangleCount; i++) {
        let baseAngle = (time * 0.001 * (0.6 + Math.sin(i * 1.7) * 0.5) + i * 0.45) + Math.sin(time * 0.0012 + i) * 0.3;
        let baseRadius = 260 + Math.sin(time * 0.002 + i * 1.3) * 120 + Math.cos(time * 0.0015 + i * 2.1) * 60;
        let jitterX = Math.sin(time * 0.003 + i * 2.3) * 30;
        let jitterY = Math.cos(time * 0.0025 + i * 1.9) * 30;
        let cx = w / 2 + Math.cos(baseAngle) * baseRadius + jitterX;
        let cy = h / 2 + Math.sin(baseAngle) * baseRadius + jitterY;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(baseAngle + Math.sin(time * 0.001 + i) * 0.3);
        ctx.beginPath();
        ctx.moveTo(0, -32);
        ctx.lineTo(28, 18);
        ctx.lineTo(-28, 18);
        ctx.closePath();
        ctx.strokeStyle = i % 2 === 0 ? '#39ff14' : '#ff29ff';
        ctx.lineWidth = 3.2;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.shadowBlur = 12;
        ctx.globalAlpha = 0.85;
        ctx.stroke();
        ctx.restore();
      }

      // If a project is hovered, change background effect
      if (hoveredProjectIndex !== null && hoveredProjectIconPos) {
        let pulse = 0.5 + 0.5 * Math.sin(time * 0.005);
        let colors = ['#39ff14', '#00fff7', '#ff29ff', '#ffe600'];
        let color = colors[hoveredProjectIndex % colors.length];
        let grad = ctx.createRadialGradient(hoveredProjectIconPos.x, hoveredProjectIconPos.y, 0, hoveredProjectIconPos.x, hoveredProjectIconPos.y, Math.max(w, h)/2 * pulse);
        grad.addColorStop(0, color + '66'); // less intense center
        grad.addColorStop(1, 'transparent');
        ctx.save();
        ctx.globalAlpha = 0.08 * pulse; // much dimmer bloom
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
      }

      // Animate triangles
      updateTriangles(hoveredProjectIconPos);
      // Draw flock triangles with brighter neon, optimized
      ctx.save();
      ctx.globalAlpha = 1;
      for (let i = 0; i < triangles.length; i++) {
        let tri = triangles[i];
        ctx.strokeStyle = tri.color;
        ctx.lineWidth = 3.5;
        ctx.shadowColor = tri.color;
        ctx.shadowBlur = 10;
        ctx.save();
        ctx.translate(tri.x, tri.y);
        ctx.rotate(tri.angle + Math.sin(performance.now() * 0.001 + i) * 0.1);
        ctx.beginPath();
        ctx.moveTo(0, -24);
        ctx.lineTo(20, 16);
        ctx.lineTo(-20, 16);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore();

      ctx.globalAlpha = 1;
    }

    function animateCyberpunkBg(time) {
      drawCyberpunkPattern(time);
      if (!isMobile) {
        requestAnimationFrame(animateCyberpunkBg);
      }
    }

    if (isMobile) {
      let lastDraw = 0;
      let scrolling = false;
      let scrollTimeout = null;
      let paused = false;
      function mobileBgLoop(time) {
        if (!paused && time - lastDraw > 50) { // ~20fps
          drawCyberpunkPattern(time);
          lastDraw = time;
        }
        requestAnimationFrame(mobileBgLoop);
      }
      // Pause animation during scroll
      window.addEventListener('scroll', function() {
        paused = true;
        if (scrollTimeout) clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(function() {
          paused = false;
        }, 180); // Resume 180ms after scroll ends
      }, { passive: true });
      mobileBgLoop(0);
    } else {
      animateCyberpunkBg(0);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const nameEl = document.querySelector('header .name');
      const surnameEl = document.querySelector('header .surname');
      [nameEl, surnameEl].forEach(el => {
        if (el) {
          el.addEventListener('mouseenter', () => {
            tearingBurstTimer = 12;
          });
        }
      });
    });
  </script>
