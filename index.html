<style>
  /* Vibrant blue, white, and shades of gray palette */
  :root {
    --main-bg: #070812;
    --main-bg-light: #1a1e2c;
    --main-bg-dark: #01020a;
    --main-blue: #00eaff;
    --main-blue-light: #66fcff;
    --main-blue-dark: #0099cc;
    --main-white: #ffffff;
    --main-gray: #d0e0ff;
    --main-gray-dark: #7a8599;
    --main-gray-light: #f0f6ff;
    --card-bg: rgba(10, 12, 18, 0.99);
    --card-border: #00eaff;
    --card-shadow: 0 0 48px #00eaff, 0 0 60px #bfc6d1, 0 0 72px #232733;
  }

  body {
    background: var(--main-bg);
    color: var(--main-white);
    font-family: 'Share Tech Mono', 'Orbitron', monospace;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Animated geometric background */
  #cyberpunk-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    pointer-events: none;
    background: transparent;
  }

  header {
    text-align: center;
    margin-top: 30px;
    margin-bottom: 10px;
    color: var(--main-blue);
    font-family: 'Orbitron', 'Share Tech Mono', monospace;
    text-shadow: 0 0 18px var(--main-blue-light), 0 0 32px var(--main-gray);
    letter-spacing: 2px;
  }

  .name,
  .surname {
    font-size: 2.7em;
    font-weight: bold;
    display: inline-block;
    margin: 0 10px;
    color: var(--main-white);
    text-shadow: 0 0 18px var(--main-blue), 0 0 32px var(--main-gray);
  }

  .title {
    font-size: 1.3em;
    color: var(--main-blue-light);
    text-shadow: 0 0 18px var(--main-blue), 0 0 32px var(--main-gray);
    margin-top: 10px;
  }

  nav {
    background: linear-gradient(90deg, var(--main-bg-dark) 0%, var(--main-bg-light) 100%);
    box-shadow: 0 0 24px var(--main-blue), 0 0 32px var(--main-gray);
    padding: 10px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    font-family: 'Orbitron', 'Share Tech Mono', monospace;
    border-bottom: 2px solid var(--main-blue);
  }

  nav a {
    color: var(--main-white);
    text-decoration: none;
    font-size: 1.15em;
    font-weight: bold;
    margin: 0 10px;
    transition:
      color 0.2s,
      background 0.3s,
      box-shadow 0.3s,
      border 0.3s;
    text-shadow: 0 0 12px var(--main-blue), 0 0 24px var(--main-gray);
    border-radius: 8px;
    padding: 8px 18px;
    border: 2px solid transparent;
    background: transparent;
    position: relative;
    z-index: 1;
  }

  nav a:hover {
    color: var(--main-blue-dark);
    background: linear-gradient(90deg, var(--main-blue-light) 40%, var(--main-gray-light) 100%);
    border: 2px solid var(--main-blue);
    box-shadow: 0 0 24px var(--main-blue), 0 0 32px var(--main-gray);
    text-shadow: 0 0 24px var(--main-blue), 0 0 32px var(--main-gray);
    outline: none;
  }

  nav a.broken-link {
    opacity: 0.4;
    cursor: not-allowed;
    color: var(--main-gray-dark);
    text-shadow: none;
    pointer-events: none;
  }

  nav a.broken-link:hover {
    background: transparent;
    border: 2px solid transparent;
    box-shadow: none;
    color: var(--main-gray-dark);
    text-shadow: none;
  }

  .social a {
    color: var(--main-blue);
    margin: 0 5px;
    font-size: 1.7em;
    text-shadow: none;
    transition: color 0.2s, background 0.2s, transform 0.2s, border 0.2s;
    border-radius: 4px;
    padding: 4px;
    background: transparent;
    box-shadow: none;
    border: 2px solid transparent;
    display: inline-block;
  }

  .social a:last-child {
    margin-right: 16px;
  }

  .social a:hover {
    color: var(--main-white);
    text-shadow: none;
    background: var(--main-blue);
    border: 2px solid var(--main-blue-light);
    box-shadow: none;
    transform: scale(1.12);
    outline: none;
  }

  content {
    font-size: 16px;
    font-family: 'Share Tech Mono', 'Orbitron', monospace;
    color: var(--main-gray-light);
    margin-top: 30px;
    margin-bottom: 30px;
    text-shadow: 0 0 18px var(--main-blue), 0 0 32px var(--main-gray);
  }

  content h2 {
    color: var(--main-blue);
    text-indent: 20px;
    text-shadow: 0 0 18px var(--main-blue), 0 0 32px var(--main-gray);
  }

  content ul {
    list-style: none;
  }

  content li a#title {
    margin-top: 10px;
    font-size: 22px;
    text-decoration: none;
    font-weight: bold;
    color: var(--main-blue);
    text-shadow: 0 0 18px var(--main-blue), 0 0 32px var(--main-gray);
  }

  content li p {
    margin: 5px 0px;
    margin-left: 2%;
  }

  #category {
    display: block;
    font-size: 2.2em;
    color: var(--main-blue);
    margin: 10px 0 10px 0;
    white-space: nowrap;
    overflow: hidden;
    width: 30em;
    animation: type 4s steps(60, end);
    text-shadow: 0 0 18px var(--main-blue), 0 0 32px var(--main-gray);
    font-family: 'Orbitron', 'Share Tech Mono', monospace;
    letter-spacing: 2px;
  }

  #category span {
    animation: blink 1s infinite;
    color: var(--main-white);
    text-shadow: 0 0 18px var(--main-blue-light), 0 0 32px var(--main-gray);
  }

  projects {
    margin: 2% 5% 0% 5%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 30px;
  }

  project {
    position: relative;
    text-align: center;
    font-family: 'Orbitron', 'Share Tech Mono', monospace;
    flex: 33%;
    max-width: 45%;
    padding: 0;
    margin-bottom: 30px;
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 18px;
    box-shadow: var(--card-shadow);
    transition: box-shadow 0.2s, border-color 0.2s;
    overflow: hidden;
  }

  project a {
    color: var(--main-white);
    text-shadow: 0 0 18px var(--main-blue), 0 0 32px var(--main-gray);
  }

  project hint {
    font-size: 32px;
    font-family: 'Orbitron', 'Share Tech Mono', monospace;
    color: #00eaff;
    visibility: visible;
    opacity: 0.4;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: opacity 0.2s ease-in-out;
    pointer-events: none;
    background: rgba(10, 12, 18, 0.6);
    padding: 6px 18px;
    border-radius: 10px;
    border: 2px solid #00eaff;
    font-weight: bold;
    z-index: 2;
  }

  project img {
    filter: grayscale(40%) brightness(1.2) contrast(1.2) drop-shadow(0 0 18px var(--main-blue));
    border: 2px solid var(--main-blue);
    box-shadow: 0 0 24px var(--main-blue), 0 0 32px var(--main-gray);
    transition: all 0.2s ease-in-out;
    vertical-align: middle;
    width: 100%;
    cursor: pointer;
    border-radius: 12px;
  }

  project:hover img {
    filter: grayscale(0%) brightness(1.4) contrast(1.4) drop-shadow(0 0 32px var(--main-blue-light));
    border-color: var(--main-blue-light);
    box-shadow: 0 0 40px var(--main-blue-light), 0 0 48px var(--main-gray);
  }

  project:hover hint {
    opacity: 1;
  }

  project.broken-link {
    opacity: 0.5;
    cursor: not-allowed;
    border-color: #7a8599;
    box-shadow: 0 0 20px #7a8599;
  }

  project.broken-link img {
    filter: blur(10px) grayscale(100%);
    cursor: not-allowed;
    border-color: #7a8599;
  }

  project.broken-link:hover img {
    filter: blur(2px) grayscale(100%);
  }

  project.broken-link hint {
    opacity: 1;
    cursor: not-allowed;
    color: #7a8599;
    text-shadow: 0 0 20px #7a8599;
  }

  project.broken-link:hover hint {
    opacity: 1;
  }

  project.broken-link::after {
    content: "⚠️ Link Unavailable";
    position: absolute;
    top: 10px;
    right: 10px;
    background: #ff0059;
    color: #181a22;
    padding: 6px 16px;
    border-radius: 8px;
    font-size: 1.1em;
    font-weight: bold;
    z-index: 20;
    pointer-events: none;
    border: 2px solid #ff0059;
    letter-spacing: 1px;
  }

  /* Responsive layout - makes a two column-layout instead of four columns */
  @media screen and (max-width: 800px) {
    project {
      flex: 50%;
      max-width: 90%;
    }
  }

  /* Responsive layout - makes the two columns stack on top of each other instead of next to each other */
  @media screen and (max-width: 600px) {
    project {
      flex: 100%;
      max-width: 100%;
    }

    .name,
    .surname {
      font-size: clamp(1.5rem, 11vw, 2.7rem);
      display: block;
      margin: 5px 0;
      width: 100%;
    }

    .title {
      font-size: 1.1em;
    }
  }

  @media (pointer:none),
  (pointer:coarse) {
    project {
      flex: 100%;
      max-width: 100%;
    }

    @media (orientation: landscape) {
      project {
        flex: 50%;
        max-width: 90%;
      }
    }

    project img {
      filter: grayscale(0%) brightness(1.3) contrast(1.3);
    }

    project hint {
      font-size: 38px;
      opacity: 1;
    }

    nav a {
      padding: 10px 20px 10px 20px;
    }
  }

  /* Renderer Toggle Button */
  .renderer-toggle {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-family: 'Orbitron', 'Share Tech Mono', monospace;
    font-size: 0.9em;
    font-weight: bold;
    color: var(--main-gray);
    background: rgba(10, 12, 18, 0.95);
    border: 2px solid var(--main-blue-dark);
    border-radius: 8px;
    padding: 10px 18px;
    transition: all 0.3s ease;
    text-shadow: 0 0 8px var(--main-blue);
    overflow: hidden;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .renderer-toggle::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 234, 255, 0.2), transparent);
    transition: left 0.5s ease;
  }

  .renderer-toggle:hover {
    color: var(--main-blue-light);
    border-color: var(--main-blue);
    box-shadow: 0 0 20px var(--main-blue), 0 0 30px var(--main-gray);
  }

  .renderer-toggle:hover::before {
    left: 100%;
  }

  .renderer-toggle:active {
    transform: scale(0.97);
  }

  .renderer-toggle .toggle-label {
    min-width: 55px;
    text-align: center;
    letter-spacing: 1px;
  }

  .renderer-toggle .toggle-icon {
    font-size: 1.1em;
    opacity: 0.8;
  }

  .renderer-toggle.active {
    border-color: var(--main-blue-light);
    color: var(--main-white);
    background: linear-gradient(135deg, rgba(0, 153, 204, 0.3), rgba(10, 12, 18, 0.95));
    box-shadow: 0 0 15px var(--main-blue), inset 0 0 10px rgba(0, 234, 255, 0.1);
  }

  /* Toast Notification */
  .renderer-toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(10, 12, 18, 0.95);
    border: 2px solid var(--main-blue);
    border-radius: 12px;
    padding: 16px 28px;
    color: var(--main-white);
    font-family: 'Share Tech Mono', monospace;
    font-size: 1em;
    box-shadow: 0 0 30px var(--main-blue), 0 0 50px rgba(0, 234, 255, 0.3);
    z-index: 10000;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-align: center;
    max-width: 90vw;
  }

  .renderer-toast.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }

  .renderer-toast.error {
    border-color: #ff0059;
    box-shadow: 0 0 30px #ff0059, 0 0 50px rgba(255, 0, 89, 0.3);
  }

  .renderer-toast.success {
    border-color: #39ff14;
    box-shadow: 0 0 30px #39ff14, 0 0 50px rgba(57, 255, 20, 0.3);
  }

  .renderer-toast .toast-title {
    font-family: 'Orbitron', monospace;
    font-weight: bold;
    margin-bottom: 6px;
    color: var(--main-blue-light);
  }

  .renderer-toast.error .toast-title {
    color: #ff5588;
  }

  .renderer-toast.success .toast-title {
    color: #39ff14;
  }

  @media screen and (max-width: 600px) {
    .renderer-toggle {
      padding: 6px 12px;
      font-size: 0.8em;
    }

    .renderer-toggle .toggle-label {
      min-width: 45px;
    }
  }
</style>

      }, { passive: true });

      mobileBgLoop(0);
    } else {
      requestAnimationFrame(renderLoop);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const nameEl = document.querySelector('header .name');
      const surnameEl = document.querySelector('header .surname');
      [nameEl, surnameEl].forEach(el => {
        if (el) {
          el.addEventListener('mouseenter', () => {
            tearingBurstTimer = 12;
          });
        }
      });
    });
  </script>
</body>

</html>
